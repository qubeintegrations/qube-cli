# Tag `v0.1.0` on github.com/qubeintegrations/qube-cli; .github/workflows/release.yml runs goreleaser.
version: 2
project_name: qube
builds:
  - main: ./cmd/qube
    binary: qube
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/qubeintegrations/qube-cli/internal/api.Version={{.Version}}"]
archives:
  - name_template: "qube_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
release:
  name_template: "qube {{ .Version }}"
  header: |
    Download the archive for your platform, unpack it and put `qube` on your PATH
    (`go install github.com/qubeintegrations/qube-cli/cmd/qube@{{ .Tag }}` works too).
# Homebrew: the release job pushes a cask to the public qubeintegrations/homebrew-tap repository
# (goreleaser's current way to ship a plain binary through Homebrew). It needs the
# HOMEBREW_TAP_GITHUB_TOKEN secret, which .github/workflows/release.yml passes through; when the
# secret is empty the cask is only written to dist/ and nothing is pushed, so a release never
# fails on it. Users run: brew install qubeintegrations/tap/qube   (macOS; Linux uses the archive)
homebrew_casks:
  - name: qube
    repository:
      owner: qubeintegrations
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: "{{ if .Env.HOMEBREW_TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}"
    directory: Casks
    homepage: https://qubesync.com
    description: "The QuBe Sync command line"
    license: MIT
    binaries: [qube]
    commit_author:
      name: qube-release-bot
      email: releases@qubesync.com
    # The binaries are not notarized: clear Gatekeeper's quarantine flag on install.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/qube"]
          end
