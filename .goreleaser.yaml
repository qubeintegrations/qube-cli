# Tag `v0.1.0` on github.com/qubeintegrations/qube-cli; .github/workflows/release.yml runs goreleaser.
version: 2
project_name: qube
builds:
  - main: ./cmd/qube
    binary: qube
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/qubeintegrations/qube-cli/internal/api.Version={{.Version}}"]
archives:
  - name_template: "qube_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
checksum:
  name_template: checksums.txt
release:
  name_template: "qube {{ .Version }}"
  header: |
    Download the archive for your platform, unpack it and put `qube` on your PATH
    (`go install github.com/qubeintegrations/qube-cli/cmd/qube@{{ .Tag }}` works too).
# Homebrew: the release job pushes a formula to the public qubeintegrations/homebrew-tap
# repository when the HOMEBREW_TAP_GITHUB_TOKEN secret is set (see README "Homebrew"); without
# the secret the formula is only generated into dist/ and nothing is pushed, so a release never
# fails on it. Users then run: brew install qubeintegrations/tap/qube
brews:
  - repository:
      owner: qubeintegrations
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}false{{ else }}true{{ end }}'
    directory: Formula
    homepage: https://qubesync.com
    description: "The QuBe Sync command line"
    commit_author:
      name: qube-release-bot
      email: releases@qubesync.com
    install: bin.install "qube"
    test: system "#{bin}/qube version"
